onboarding = false
[keys]
# prefix+g opens the session navigator by default.
goto = ""

[[keys.command]]
command = "lazygit"
description = "open lazygit"
height = "80%"
key = "prefix+g"
type = "popup"
width = "80%"

[ui]
# Mouse wheel and keyboard scrollback still work without the bar.
pane_scrollbars = false
