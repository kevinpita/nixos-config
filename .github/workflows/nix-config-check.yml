name: "NixOS Configuration Check"
on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Check Nix flake inputs
        run: |
          nix flake check --all-systems --show-trace --no-write-lock-file \
            --override-input nixos-secrets path:./ci-dummy-input \
            --override-input nixos-work path:./ci-dummy-input
