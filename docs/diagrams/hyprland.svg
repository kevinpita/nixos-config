<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" role="img" aria-labelledby="title">
  <title id="title">The Nix-generated Hyprland entry loads the host Lua, then the shared Lua, live from the checkout. DankMaterialShell reads settings JSON through writable links and receives plugins and patches through Nix after just switch.</title>
  <style>
    text { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1f2328; }
    .note { font-size: 11px; fill: #59636e; }
    .term { font-weight: 600; }
    .line { fill: none; stroke-width: 6; stroke-linecap: round; }
    .feeder { fill: none; stroke-width: 4; stroke-linecap: round; }
    .stop { fill: #ffffff; stroke-width: 3; }
    .hub { stroke: #1f2328; }
    .optional { stroke-dasharray: 3 3; }
    .link { stroke-dasharray: 2 10; }
    .purple { stroke: #a371f7; }
    .green { stroke: #3fb950; }
    .blue { stroke: #2f81f7; }
    .orange { stroke: #fb8f44; }
    .red { stroke: #f85149; }
    .gray { stroke: #8c959f; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .note { fill: #9198a1; }
      .stop { fill: #0d1117; }
      .hub { stroke: #e6edf3; }
    }
  </style>

  <path class="line purple" d="M60 60 L820 60"/>
  <path class="line green" d="M60 150 L600 150 C650 150, 650 179, 700 179 L820 179"/>
  <path class="line blue" d="M60 220 L600 220 C650 220, 650 191, 700 191 L820 191"/>

  <circle class="stop hub" cx="60" cy="60" r="10"/>
  <circle class="stop purple" cx="300" cy="60" r="8"/>
  <circle class="stop purple" cx="540" cy="60" r="8"/>
  <circle class="stop hub" cx="820" cy="60" r="10"/>
  <circle class="stop green" cx="60" cy="150" r="8"/>
  <circle class="stop green" cx="300" cy="150" r="8"/>
  <circle class="stop blue" cx="60" cy="220" r="8"/>
  <circle class="stop blue" cx="300" cy="220" r="8"/>
  <circle class="stop hub" cx="540" cy="220" r="10"/>
  <rect class="stop hub" x="810" y="169" width="20" height="32" rx="10"/>

  <text x="48" y="90">generated entry</text>
  <text class="note" x="48" y="106">~/.config/hypr</text>
  <text x="300" y="90" text-anchor="middle">hosts/&lt;hostname&gt;/hyprland.lua</text>
  <text class="note" x="300" y="106" text-anchor="middle">loads first</text>
  <text x="540" y="90" text-anchor="middle">hyprland/hyprland.lua</text>
  <text class="note" x="540" y="106" text-anchor="middle">loads second</text>
  <text class="term" x="838" y="65">Hyprland</text>
  <text x="48" y="132">settings.json</text>
  <text x="300" y="132" text-anchor="middle">plugin_settings.json</text>
  <text x="48" y="250">plugins/</text>
  <text x="300" y="250" text-anchor="middle">patches/</text>
  <text x="540" y="250" text-anchor="middle">just switch</text>
  <text class="term" x="838" y="190">DankMaterialShell</text>
  <rect x="40" y="273" width="18" height="5" rx="2" fill="#a371f7"/>
  <text class="note" x="64" y="280">live Lua</text>
  <rect x="140" y="273" width="18" height="5" rx="2" fill="#3fb950"/>
  <text class="note" x="164" y="280">live JSON, writable links</text>
  <rect x="330" y="273" width="18" height="5" rx="2" fill="#2f81f7"/>
  <text class="note" x="354" y="280">Nix package, needs just switch</text>
</svg>
