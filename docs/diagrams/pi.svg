<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" role="img" aria-labelledby="title">
  <title id="title">Pi deployment: AGENTS.md goes to Pi with AGENTS.pi.md appended, to oh-my-pi, and to Claude Code. skills/ goes to ~/.pi/agent/skills, which Codex and Antigravity link to, and without bro to oh-my-pi and Claude Code. omp-config.yml is a writable link from ~/.omp/agent/config.yml.</title>
  <style>
    text { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1f2328; }
    .note { font-size: 11px; fill: #59636e; }
    .term { font-weight: 600; }
    .line { fill: none; stroke-width: 6; stroke-linecap: round; }
    .feeder { fill: none; stroke-width: 4; stroke-linecap: round; }
    .stop { fill: #ffffff; stroke-width: 3; }
    .hub { stroke: #1f2328; }
    .optional { stroke-dasharray: 3 3; }
    .link { stroke-dasharray: 2 10; }
    .purple { stroke: #a371f7; }
    .green { stroke: #3fb950; }
    .blue { stroke: #2f81f7; }
    .orange { stroke: #fb8f44; }
    .red { stroke: #f85149; }
    .gray { stroke: #8c959f; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .note { fill: #9198a1; }
      .stop { fill: #0d1117; }
      .hub { stroke: #e6edf3; }
    }
  </style>

  <path class="line purple" d="M60 70 L620 70"/>
  <path class="line purple" d="M140 70 C190 70, 190 120, 240 120 L620 120"/>
  <path class="line purple" d="M140 70 C190 70, 190 170, 240 170 L620 170"/>
  <path class="feeder gray" d="M340 30 L340 62"/>
  <path class="line green" d="M60 240 L340 240"/>
  <path class="line link green" d="M340 240 L620 240"/>
  <path class="line green" d="M140 240 C190 240, 190 290, 240 290 L620 290"/>
  <path class="line link blue" d="M60 360 L620 360"/>

  <circle cx="340" cy="30" r="5" fill="#8c959f"/>
  <circle class="stop hub" cx="60" cy="70" r="10"/>
  <circle class="stop purple" cx="340" cy="70" r="8"/>
  <circle class="stop hub" cx="620" cy="70" r="10"/>
  <circle class="stop hub" cx="620" cy="120" r="10"/>
  <circle class="stop hub" cx="620" cy="170" r="10"/>
  <circle class="stop hub" cx="60" cy="240" r="10"/>
  <circle class="stop green" cx="340" cy="240" r="8"/>
  <circle class="stop hub" cx="620" cy="240" r="10"/>
  <circle class="stop green" cx="340" cy="290" r="8"/>
  <circle class="stop hub" cx="620" cy="290" r="10"/>
  <circle class="stop hub" cx="60" cy="360" r="10"/>
  <circle class="stop hub" cx="620" cy="360" r="10"/>

  <text x="60" y="50" text-anchor="middle">AGENTS.md</text>
  <text x="340" y="20" text-anchor="middle">AGENTS.pi.md</text>
  <text class="note" x="340" y="95" text-anchor="middle">appended</text>
  <text class="term" x="638" y="75">Pi</text>
  <text class="note" x="638" y="92">~/.pi/agent/AGENTS.md</text>
  <text class="term" x="638" y="125">oh-my-pi</text>
  <text class="note" x="638" y="142">~/.omp/agent/AGENTS.md</text>
  <text class="term" x="638" y="175">Claude Code</text>
  <text class="note" x="638" y="192">~/.claude/CLAUDE.md</text>
  <text x="60" y="220" text-anchor="middle">skills/</text>
  <text x="340" y="225" text-anchor="middle">~/.pi/agent/skills</text>
  <text class="term" x="638" y="245">Codex · Antigravity</text>
  <text class="note" x="638" y="262">symlink to ~/.pi/agent/skills</text>
  <text class="note" x="340" y="315" text-anchor="middle">without bro</text>
  <text class="term" x="638" y="295">oh-my-pi · Claude Code</text>
  <text class="note" x="638" y="312">~/.omp/agent/skills, ~/.claude/skills</text>
  <text x="60" y="340" text-anchor="middle">omp-config.yml</text>
  <text class="note" x="340" y="350" text-anchor="middle">writable link, omp edits it in place</text>
  <text class="term" x="638" y="365">oh-my-pi settings</text>
  <text class="note" x="638" y="382">~/.omp/agent/config.yml</text>
  <rect x="40" y="393" width="18" height="5" rx="2" fill="#a371f7"/>
  <text class="note" x="64" y="400">instructions</text>
  <rect x="150" y="393" width="18" height="5" rx="2" fill="#3fb950"/>
  <text class="note" x="174" y="400">skills</text>
  <rect x="230" y="393" width="18" height="5" rx="2" fill="#2f81f7"/>
  <text class="note" x="254" y="400">omp settings</text>
</svg>
