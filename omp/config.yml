defaultThinkingLevel: medium
modelProviderOrder:
  - anthropic
  - openai-codex
  - zai
modelRoles:
  default: anthropic/claude-opus-5-5:medium
  smol: anthropic/claude-opus-5-5:low
  slow: anthropic/claude-opus-5-5:xhigh
  vision: openai-codex/gpt-6.1-sol:xhigh
  plan: anthropic/claude-opus-5-5:xhigh
  commit: "@smol"
  tiny: "@smol"
  memory: "@smol"
  task: anthropic/claude-opus-5-5:medium
  advisor: openai-codex/gpt-6.1-sol:xhigh
  image: openai-codex/gpt-image-2
  judge: "@smol"
  security: zai/glm-5.3:high
providers:
  maxInFlightRequests:
    nan: 10
retry:
  rateLimitWalksChain: true
  fallbackChains:
    default:
      - openai-codex/gpt-6.1-sol
      - zai/glm-5.3
    task:
      - openai-codex/gpt-6.1-sol
      - zai/glm-5.3
    advisor:
      - anthropic/claude-opus-5-5
      - zai/glm-5.3
    reviewer:
      - anthropic/claude-opus-5-5
      - zai/glm-5.3
task:
  enableEffort: false
  agentModelOverrides:
    scout: "@smol"
    reviewer: "@advisor"
    security-reviewer: "@security"
symbolPreset: nerd
composer:
  shape: band
theme:
  dark: desktop
setupVersion: 3
browser:
  headless: true
advisor:
  enabled: true
dev:
  autoqaConsent: denied
hideThinkingBlock: false